<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autostream dial</title>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/hd.css">
</head>
<body class="hd">
<main id="app" class="screen">
<button type="button" class="handle" id="handle" aria-label="Open settings" aria-expanded="false"><span></span></button>
<div class="main">
<div class="left" id="left">
<section class="region" id="appliances-region">
<div class="section-label">Appliances</div>
<div class="list" id="appliances-list">
<div class="appliances" id="appliances"></div>
<div class="empty-note" id="appliances-note" hidden></div>
</div>
</section>
<section class="region" id="speakers-region">
<div class="section-label" id="speakers-label">Speakers</div>
<div class="list" id="speakers-list">
<div class="speakers" id="speakers"></div>
<div class="empty-note" id="speakers-note" hidden></div>
</div>
</section>
</div>
<div class="right" id="right">
<div class="art-zone" id="art-zone">
<img class="backdrop ghost" id="backdrop-prev" alt="" aria-hidden="true">
<img class="backdrop" id="backdrop" src="/api/v1/logo/backdrop" alt="" aria-hidden="true">
<div class="art-frame">
<img class="art ghost logo" id="art-prev" alt="" aria-hidden="true">
<img class="art logo" id="art" src="/static/logo.png" alt="Artwork">
</div>
</div>
<div class="replay-row" id="replay-row"></div>
<div class="track-row">
<div class="track-text">
<div class="track-title" id="title"></div>
<div class="track-sub" id="sub"></div>
</div>
<button type="button" class="icon-btn" id="eq-open" aria-label="Open equaliser" hidden>
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4v16M12 4v16M19 4v16"/><circle cx="5" cy="14" r="2.4" class="eq-knob"/><circle cx="12" cy="8" r="2.4" class="eq-knob"/><circle cx="19" cy="16" r="2.4" class="eq-knob"/></svg>
</button>
</div>
<div class="volume-row" id="volume-row">
<button type="button" class="icon-btn" id="mute" aria-pressed="false" aria-label="Mute">
<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="mute-waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute-slash" d="M3 3l18 18"/></svg>
</button>
<input class="hslider" type="range" min="0" max="100" value="0" id="master" aria-label="Master volume" disabled>
<div class="vol-num" id="master-num"></div>
</div>
</div>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-label="Dial settings" inert>
<div class="sheet-col">
<h2>Screen</h2>
<div class="setting">
<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
<input class="hslider" type="range" min="5" max="100" value="80" id="brightness" aria-label="Brightness">
<div class="level-num" id="brightness-num"></div>
</div>
<div class="setting-row"><span>Sleep after</span><div class="seg" id="sleep-after" role="group" aria-label="Sleep after"></div></div>
<div class="setting-row"><span>Always show controls</span><label class="output-toggle"><input type="checkbox" id="always" aria-label="Always show controls"><span class="switch"></span></label></div>
<div class="setting-row"><button type="button" class="pill-btn" id="sleep-now">Sleep now</button></div>
</div>
<div class="sheet-col">
<h2>This dial</h2>
<dl class="info" id="info"></dl>
<div class="empty-note" id="info-note" hidden></div>
</div>
<div class="grip"></div>
</section>
<section class="eq" id="eq" aria-label="Equaliser" inert>
<div class="eq-head">
<button type="button" class="icon-btn" id="eq-close" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<h2 class="eq-title">Equaliser <span class="eq-for" id="eq-for"></span></h2>
<button type="button" class="pill-btn" id="eq-reset">Reset</button>
</div>
<div class="eq-body">
<div class="eq-bands-row" id="eq-bands"></div>
<canvas class="eq-graph" id="eq-graph" aria-label="Equaliser response"></canvas>
</div>
<div class="empty-note" id="eq-note" hidden></div>
</section>
<div class="modal" id="modal" hidden>
<div class="card" id="card" role="alertdialog" aria-modal="true" aria-labelledby="card-title">
<div class="card-title" id="card-title"></div>
<div class="card-message" id="card-message"></div>
<div class="pin-boxes" id="card-pin-boxes" role="status" aria-live="polite" hidden>
<span class="pin-box"></span><span class="pin-box"></span><span class="pin-box"></span><span class="pin-box"></span><span class="pin-box"></span><span class="pin-box"></span><span class="pin-box"></span><span class="pin-box"></span>
</div>
<div class="pin-error" id="card-pin-error" hidden></div>
<div class="card-source" id="card-source"></div>
<div class="progress" id="card-progress"><div class="progress-bar" id="card-bar"></div></div>
<div class="card-buttons" id="card-buttons"></div>
<div class="pin-pad" id="card-pin-pad" hidden>
<button type="button" class="pin-key" data-key="1">1</button><button type="button" class="pin-key" data-key="2">2</button><button type="button" class="pin-key" data-key="3">3</button>
<button type="button" class="pin-key" data-key="4">4</button><button type="button" class="pin-key" data-key="5">5</button><button type="button" class="pin-key" data-key="6">6</button>
<button type="button" class="pin-key" data-key="7">7</button><button type="button" class="pin-key" data-key="8">8</button><button type="button" class="pin-key" data-key="9">9</button>
<button type="button" class="pin-key del" data-key="del" aria-label="Delete">&#9003;</button><button type="button" class="pin-key" data-key="0">0</button><button type="button" class="pin-key ok" data-key="ok">OK</button>
</div>
</div>
</div>
<div class="offline-bar" id="offline" role="status"></div>
<div class="toast" id="toast" role="status"></div>
<div class="portrait-note">Turn the screen to landscape.</div>
<div class="sleep" id="sleep" aria-hidden="true"><span>Touch to wake</span></div>
</main>
<script src="/static/hd.js"></script>
</body>
</html>
