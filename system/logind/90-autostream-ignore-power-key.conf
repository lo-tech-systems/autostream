# /etc/systemd/logind.conf.d/90-autostream-ignore-power-key.conf
#
# This file is part of autostream.
# Copyright (c) 2026 Lo-tech Systems Limited. All rights reserved.
#
# Autostream operates as an unattended appliance.  Suppress short-press
# power-key handling so that USB enumeration events that generate spurious
# kernel power-key events cannot shut down or power off the system.
# Long-press behaviour is governed separately by HandlePowerKeyLongPress.

[Login]
HandlePowerKey=ignore
