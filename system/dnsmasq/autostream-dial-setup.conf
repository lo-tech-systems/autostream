# /etc/dnsmasq.d/autostream-dial-setup.conf
#
# Captive-portal DNS configuration for autostream dial AP mode.
# Used by autostream_dial_dnsmasq.service when the dial is acting as its own
# WiFi access point during initial setup.
#
# This file is part of autostream dial.
# Copyright (c) 2025-2026 Lo-tech Systems Limited. All rights reserved.

# Only listen on the AP interface.
# Template token: the watcher substitutes the resolved built-in recovery
# interface and writes the result under /run/autostream/ before starting.
interface=__AUTOSTREAM_WIFI_IFACE__
bind-interfaces
except-interface=lo

# DHCP range — gateway 192.168.4.1/24, hand out .50–.200
dhcp-range=192.168.4.50,192.168.4.200,255.255.255.0,12h

# Default gateway option
dhcp-option=option:router,192.168.4.1

# DNS server option: point clients at this box
dhcp-option=option:dns-server,192.168.4.1

# RFC 8910 Captive Portal API (iOS / macOS / modern clients)
dhcp-option=114,http://192.168.4.1/.well-known/captive-portal

# Domain handed to clients
domain=local
expand-hosts

# DNS hijack: send ALL DNS to the captive portal IP
address=/#/192.168.4.1

# Don't use /etc/resolv.conf (prevents real DNS leaking in AP mode)
no-resolv

# Upstream DNS (unused due to address=/#/ but keeps dnsmasq happy)
server=1.1.1.1
server=8.8.8.8

log-queries
log-dhcp
