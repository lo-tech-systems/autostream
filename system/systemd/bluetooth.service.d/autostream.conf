#
# Starts bluetoothd with autostream's BlueZ settings (/etc/bluetooth/autostream.conf)
# in place of /etc/bluetooth/main.conf. Without them the adapter reports a
# Miscellaneous class, and a source searching for a speaker does not list it.

[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd -f /etc/bluetooth/autostream.conf
