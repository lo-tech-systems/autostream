#
# Fixed appliance journald storage bounds.
# Do not set MaxLevelStore or MaxLevelSystem; system diagnostics must remain available.
# Storage must be set explicitly: Raspberry Pi OS ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf (Storage=volatile),
# and without an override here the journal is lost on every reboot, defeating
# the retention bounds below.

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=128M
SystemKeepFree=512M
MaxRetentionSec=14day
RateLimitIntervalSec=30s
RateLimitBurst=1000
