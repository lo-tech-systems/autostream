#
# Baseline journald storage bounds, coupled to the DEBUG/spam diagnostic tier.
# Do not set MaxLevelStore or MaxLevelSystem; system diagnostics must remain available.
#
# Storage rests at "volatile" (SD-write-free, matching the Raspberry Pi OS default
# shipped in /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf) so the
# journal costs nothing at rest. autostream_log_policy.py's set_log_level couples
# persistence to the DIAG log tier: while the platform level is debug/spam it writes
# a higher-priority drop-in, /etc/systemd/journald.conf.d/zz-autostream-diag-persistent.conf
# (the "zz-" prefix sorts after this file, so it wins), forcing Storage=persistent for
# the duration of the diagnostic session. That drop-in is removed the moment the level
# de-escalates below debug, and journald reverts to this file's volatile baseline. The
# size/retention/rate-limit keys below remain a safety net for the DIAG windows.

[Journal]
Storage=volatile
Compress=yes
SystemMaxUse=128M
SystemKeepFree=512M
MaxRetentionSec=14day
RateLimitIntervalSec=30s
RateLimitBurst=1000
