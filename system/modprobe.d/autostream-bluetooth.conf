# /etc/modprobe.d/autostream-bluetooth.conf
#
# This file is part of autostream.
# Copyright (c) 2026 Lo-tech Systems Limited. All rights reserved.
#
# Installed only when Bluetooth input is enabled (BLUETOOTH_MODE=on).
#
# Card id ASBT (addressed as hw:CARD=ASBT,...) so the monitor's capture
# device string does not depend on card *index* ordering against a USB ADC.
# index=-2 requests a high slot so this loopback never displaces hw:0/hw:1.
# One substream: single Bluetooth source (see HLD section 2 scope).
options snd-aloop enable=1 index=-2 pcm_substreams=1 id=ASBT
