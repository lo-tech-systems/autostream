# Runtime directory for the audio FIFO that autostream_monitor writes and the
# playback backend (OwnTone) reads.
#
# This lives under /run rather than /tmp because /tmp is subject to age-based
# cleanup: after a long idle period the FIFO is deleted while the backend still
# holds it open, and the backend then keeps reading the deleted FIFO instead of
# the replacement, so nothing it is sent is ever played. Nothing ages /run, and
# the "-" age field below keeps these entries out of any cleanup.
#
# The FIFO is created here as well as by autostream at runtime, so that it
# already exists when the backend starts and watches it.
#
#Type Path                                  Mode Uid        Gid        Age
d     /run/autostream-pipes                 0755 autostream autostream -
p     /run/autostream-pipes/autostream.fifo 0666 autostream autostream -
