# Bounds systemd-coredump storage so a crash (or a crash loop) cannot fill the
# SD card on an appliance or a dial. Size caps only; the total allows one dump
# of the largest size kept.
#
# Raspberry Pi OS does not include systemd-coredump, and autostream does not
# install it, so by default nothing takes core dumps and this file has no
# effect. It is here so that a dump is bounded if systemd-coredump is installed
# to investigate a crash.
#
# systemd-coredump reads this on every dump, so no service restart is needed
# after install.
[Coredump]
Storage=external
Compress=yes
MaxUse=256M
KeepFree=512M
ProcessSizeMax=256M
ExternalSizeMax=256M
