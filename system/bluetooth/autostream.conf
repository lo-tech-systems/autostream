# /etc/bluetooth/main.conf.d/autostream.conf
#
# This file is part of autostream.
# Copyright (c) 2026 Lo-tech Systems Limited. All rights reserved.
#
# Installed only when Bluetooth input is enabled (BLUETOOTH_MODE=on).
#
# The appliance is an A2DP sink for a single trusted turntable; pairing is a
# routine, user-initiated action (Setup page, no separate discoverability
# toggle needed) so these timeouts are disabled rather than tuned.
# Discoverable/Pairable themselves are toggled at runtime by the Bluetooth
# service (bluetooth_bluez.py) only while the pairing modal's scan window is
# open -- this file only removes their timeouts.

[General]
DiscoverableTimeout = 0
PairableTimeout = 0
