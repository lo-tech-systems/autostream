# /etc/bluetooth/autostream.conf
#
# This file is part of autostream.
# Copyright (c) 2026 Lo-tech Systems Limited. All rights reserved.
#
# Installed with the Bluetooth stack on every appliance.
#
# bluetoothd reads this file in place of /etc/bluetooth/main.conf: the
# bluetooth.service drop-in starts it with -f. BlueZ reads no main.conf.d
# directory, and main.conf belongs to the bluez package, so it is left alone.
# Anything not set here takes bluetoothd's built-in default.
#
# The appliance is an A2DP sink for one paired source. It is discoverable
# and pairable only while the Setup page's pairing screen is open: the
# Bluetooth service sets Discoverable and Pairable for that window, with
# timeouts a little longer than the window as a backstop, and clears them
# again when it closes. The values below are bluetoothd's defaults for a new
# adapter only; bluetoothd keeps the alias and timeouts it was last given
# per adapter under /var/lib/bluetooth/<address>/settings.

[General]
# Audio/Video, Loudspeaker. A source that searches for a sink looks for this
# class and ignores a Miscellaneous device.
Class = 0x240414

DiscoverableTimeout = 0
PairableTimeout = 0

# A source that lost its bond and pairs again is passed to the agent, which
# accepts it while the pairing screen is open.
JustWorksRepairing = confirm

[Policy]
# The appliance never pages a source that dropped its link. The source
# connects to the appliance when it is switched on, and a page attempt on an
# adapter that shares its radio with Wi-Fi stalls the network stream.
ReconnectAttempts = 0
