# /etc/rpi/swap.conf.d/99-autostream-swap.conf
#
# This file is part of autostream.
# Copyright (c) 2026 Lo-tech Systems Limited. All rights reserved.
#
# Raspberry Pi OS sizes its swap file from the board's RAM (RAM x 1, up to
# 2048 MiB), so a 4 GB board puts a 2 GB file on its SD card. A swap file that
# size only encourages the card to be written to under memory pressure, and the
# space is better left free. Limit the file to 512 MiB, on the appliance and on
# the dial alike. The zram swap settings are left as they are.
#
# rpi-swap reads this when it sets swap up at boot, so a change takes effect at
# the next reboot; a larger file that already exists is expected to be replaced
# then [not yet confirmed on a device].

[File]
MaxSizeMiB=512
