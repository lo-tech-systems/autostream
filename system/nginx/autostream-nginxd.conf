map $http_referer $from_setup {
    default 0;
    ~*/setup(?:$|[/?#]) 1;
}

# Restrict the ?next= redirect target on /offline/retrying to relative paths
# only, preventing an open redirect to external URLs.
map $arg_next $safe_next {
    default   /;
    ~^/[^/]   $arg_next;
}

