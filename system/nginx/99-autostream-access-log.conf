#
# Suppress successful (2xx) access log entries by default.
# autostream_admin set-nginx-access-log verbose|normal rewrites this file
# when the platform log level changes to/from debug or spam.

map $status $autostream_access_log_level {
    ~^2   0;
    default 1;
}
