#
# Reverse-proxies port 80 to the dial HTTP server (port 7842).
# When /tmp/autostream-dial-apmode exists, switches backend to wifi_watcher
# (port 9080) for the captive-portal setup flow.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Normal operating mode: dial HTTP server on 7842.
    # AP mode: wifi_watcher captive portal on 9080.
    set $backend http://127.0.0.1:7842;
    if (-f /tmp/autostream-dial-apmode) {
        set $backend http://127.0.0.1:9080;
    }

    location / {
        proxy_pass $backend$uri$is_args$args;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    5s;
        proxy_read_timeout    15s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @offline;
    }

    location @offline {
        default_type text/plain;
        return 503 "autostream dial is starting — please wait a moment and refresh.";
    }
}
