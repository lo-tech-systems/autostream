# NGINX configuration for autostream dial
# Copyright (c) 2025-2026 Lo-tech Systems Limited. All rights reserved.
#
# Reverse-proxies port 80 to the dial HTTP server (port 7842).
# When /tmp/autostream-dial-apmode exists, switches backend to wifi_watcher
# (port 9080) for the captive-portal setup flow.
# When /tmp/autostream-dial-updating exists, redirects all requests to the
# branded updating page so users see progress during firmware updates.
#
# Static images and offline recovery pages are served directly by nginx from
# /opt/autostream/nginx/ using sub_filter to adapt shared HTML for dial branding.
# CGI endpoints (reboot, factory-reset, update-status, download-logs) are
# handled by fcgiwrap.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Normal operating mode: dial HTTP server on 7842.
    # AP mode: wifi_watcher captive portal on 9080.
    set $backend http://127.0.0.1:7842;
    if (-f /tmp/autostream-dial-apmode) {
        set $backend http://127.0.0.1:9080;
    }

    # Updating flag — set before location / so the variable is always defined.
    set $is_updating 0;
    if (-f /tmp/autostream-dial-updating) {
        set $is_updating 1;
    }

    # ---- Static image files -------------------------------------------------
    # Served directly by nginx, bypassing the Python service.

    location = /autostream-dial-badge.png {
        alias /opt/autostream/images/autostream-dial-badge.png;
    }

    location = /favicon.ico {
        alias /opt/autostream/images/favicon.ico;
    }

    location = /favicon-16x16.png {
        alias /opt/autostream/images/favicon-16x16.png;
    }

    location = /favicon-32x32.png {
        alias /opt/autostream/images/favicon-32x32.png;
    }

    # ---- Offline recovery pages ---------------------------------------------
    # Shared HTML pages from /opt/autostream/nginx/offline/ with dial-specific
    # string substitution applied at serve time via sub_filter.

    location = /offline/ {
        root /opt/autostream/nginx;
        default_type text/html;
        sub_filter_once off;
        sub_filter "/autostream-badge.png"           "/autostream-dial-badge.png";
        sub_filter "autostream_XXXX"                 "autostream-dial_XXXX";
        sub_filter ">autostream<"                    ">autostream dial<";
        sub_filter "<title>autostream</title>"       "<title>autostream dial</title>";
        sub_filter "alt=\"AutoStream\""              "alt=\"autostream dial\"";
        sub_filter "'autostream-logs.zip'"           "'autostream-dial-logs.zip'";
        sub_filter "__BASEURL__"                     "$scheme://$host/";
        add_header Cache-Control "no-store";
        try_files /offline/index.html =500;
    }

    location = /offline/rebooting {
        root /opt/autostream/nginx;
        default_type text/html;
        sub_filter_once off;
        sub_filter "/autostream-badge.png"           "/autostream-dial-badge.png";
        sub_filter "<title>autostream</title>"       "<title>autostream dial</title>";
        sub_filter "alt=\"AutoStream\""              "alt=\"autostream dial\"";
        add_header Cache-Control "no-store";
        try_files /offline/rebooting.html =404;
    }

    location = /offline/resetting {
        root /opt/autostream/nginx;
        default_type text/html;
        sub_filter_once off;
        sub_filter "/autostream-badge.png"           "/autostream-dial-badge.png";
        sub_filter "autostream_XXXX"                 "autostream-dial_XXXX";
        sub_filter "<title>autostream</title>"       "<title>autostream dial</title>";
        sub_filter "alt=\"AutoStream\""              "alt=\"autostream dial\"";
        add_header Cache-Control "no-store";
        try_files /offline/resetting.html =404;
    }

    location = /offline/updating {
        root /opt/autostream/nginx;
        default_type text/html;
        sub_filter_once off;
        sub_filter "/autostream-badge.png"                             "/autostream-dial-badge.png";
        sub_filter "<title>autostream</title>"                         "<title>autostream dial</title>";
        sub_filter "alt=\"AutoStream\""                                "alt=\"autostream dial\"";
        sub_filter "autostream is currently updating."                 "autostream dial is currently updating.";
        sub_filter "Waiting for autostream..."                         "Waiting for autostream dial...";
        sub_filter "autostream appliance is restarting, please wait."  "autostream dial is restarting, please wait.";
        sub_filter "Checking if autostream is back online..."          "Checking if autostream dial is back online...";
        add_header Cache-Control "no-store";
        try_files /offline/updating.html =404;
    }

    # ---- CGI endpoints ------------------------------------------------------
    # Handled by fcgiwrap. www-data (fcgiwrap worker) is granted adm group
    # membership and sudo access to autostream_admin for the privileged verbs.

    location = /offline/reboot {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/autostream/nginx/cgi/reboot.cgi;
        fastcgi_param SCRIPT_NAME /offline/reboot;
        fastcgi_pass unix:/run/fcgiwrap.socket;
    }

    location = /offline/factory-reset {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/autostream/nginx/cgi/factory-reset.cgi;
        fastcgi_param SCRIPT_NAME /offline/factory-reset;
        fastcgi_pass unix:/run/fcgiwrap.socket;
    }

    location = /offline/update-status {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/autostream/nginx/cgi/update-status.cgi;
        fastcgi_param SCRIPT_NAME /offline/update-status;
        fastcgi_pass unix:/run/fcgiwrap.socket;
    }

    location = /offline/download-logs {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/autostream/nginx/cgi/download-logs.cgi;
        fastcgi_param SCRIPT_NAME /offline/download-logs;
        fastcgi_pass unix:/run/fcgiwrap.socket;
    }

    # ---- Main proxy ---------------------------------------------------------

    location / {
        if ($is_updating) {
            return 302 /offline/updating;
        }

        proxy_pass $backend$uri$is_args$args;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    5s;
        proxy_read_timeout    15s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @offline;
    }

    location @offline {
        return 302 /offline/;
    }
}
