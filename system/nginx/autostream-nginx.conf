# NOTE: The following additions implement a 2-second *client-side* retry
# when the request came from /setup and the upstream returns 502/503/504.
# (Stock nginx cannot sleep 2s and then re-proxy the same request server-side
# without Lua/OpenResty or a third-party module.)

# ---- Depends on these maps in http{} scope (outside the server{}), e.g. in nginx.conf ----
# map $http_referer $from_setup {
#     default 0;
#     ~*/setup(?:$|[/?#]) 1;
# }
# map $arg_next $safe_next {
#     default   /;
#     ~^/[^/]   $arg_next;
# }

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Apple icons
    location = /apple-touch-icon.png { alias /opt/autostream/images/apple-touch-icon-dark.png; }
    location = /apple-touch-icon-precomposed.png { alias /opt/autostream/images/apple-touch-icon-dark.png; }
    location = /apple-touch-icon-120x120.png { alias /opt/autostream/images/apple-touch-icon-dark.png; }
    location = /apple-touch-icon-152x152.png { alias /opt/autostream/images/apple-touch-icon-dark.png; }
    location = /apple-touch-icon-167x167.png { alias /opt/autostream/images/apple-touch-icon-dark.png; }
    location = /apple-touch-icon-180x180.png { alias /opt/autostream/images/apple-touch-icon-dark.png; }
    location = /favicon.ico { alias /opt/autostream/images/favicon.ico; }
    location = /favicon-16x16.png { alias /opt/autostream/images/favicon-16x16.png; }
    location = /favicon-32x32.png { alias /opt/autostream/images/favicon-32x32.png; }
    location = /autostream-badge.png { alias /opt/autostream/images/autostream-badge.png; }
    location = /autostream-badge-dark.png { alias /opt/autostream/images/autostream-badge-dark.png; }
    location = /autostream-logo-centred.png { alias /opt/autostream/images/autostream-logo-centred.png; }
    location = /autostream-logo-centred-dark.png { alias /opt/autostream/images/autostream-logo-centred-dark.png; }
    location = /lo-tech-logo.png { alias /opt/autostream/images/lo-tech-logo.png; }
    location = /lo-tech-logo-dark.png { alias /opt/autostream/images/lo-tech-logo-dark.png; }

    # Default backend (normal operating mode)
    set $html_backend http://127.0.0.1:8080;

    # When /tmp/apmode exists, switch backend to WiFi setup page
    # and cancel any redirect
    if (-f /tmp/apmode) {
        set $html_backend http://127.0.0.1:9080;
    }

    # When the boot-time retry service is running an interrupted update, redirect
    # all proxied requests to the updating progress page.  Exact-match locations
    # for /offline/... take priority over location / so the update-status endpoint,
    # log download, and reboot button remain accessible during a retry.
    set $is_updating 0;
    if (-f /tmp/autostream-updating) {
        set $is_updating 1;
    }

    # Intercept upstream failures and show offline page
    proxy_intercept_errors on;

    # Route 404/502/503/504 to a named handler that can branch on the referer
    error_page 404 502 503 504 = @upstream_failed;

    # Choose between normal offline and a retrying page for /setup referers
    location @upstream_failed {
        # If the browser came from /setup, show a retry page that refreshes back
        # to the original URL after ~2 seconds.
        if ($from_setup) {
            return 302 /offline/retrying?next=$request_uri;
        }

        # Otherwise, show the normal offline page
        return 302 /offline/;
    }

    # -------- Offline pages --------
    location = /offline/ {
        root /opt/autostream/nginx;
        default_type text/html;

        sub_filter_once on;
        sub_filter "__BASEURL__" "$scheme://$host/";

        add_header Cache-Control "no-store";
        try_files /offline/index.html =500;
    }

    # Retrying page (HTML should meta-refresh to __NEXT__ after 2s)
    location = /offline/retrying {
        root /opt/autostream/nginx;
        default_type text/html;

        add_header Cache-Control "no-store";

        sub_filter_once off;
        sub_filter "__NEXT__" "$safe_next";

        try_files /offline/retrying.html =404;
    }

    location = /offline/rebooting {
        root /opt/autostream/nginx;
        add_header Cache-Control "no-store";
        try_files /offline/rebooting.html =404;
    }

    location = /offline/resetting {
        root /opt/autostream/nginx;
        add_header Cache-Control "no-store";
        try_files /offline/resetting.html =404;
    }

    location = /offline/updating {
        root /opt/autostream/nginx;
        add_header Cache-Control "no-store";
        try_files /offline/updating.html =404;
    }

    # -------- CGI endpoints (fcgiwrap) --------
    location = /offline/download-logs {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/autostream/nginx/cgi/download-logs.cgi;
        fastcgi_param SCRIPT_NAME /offline/download-logs;
        fastcgi_pass unix:/run/fcgiwrap.socket;
    }

    location = /offline/reboot {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/autostream/nginx/cgi/reboot.cgi;
        fastcgi_param SCRIPT_NAME /offline/reboot;
        fastcgi_pass unix:/run/fcgiwrap.socket;
    }

    location = /offline/factory-reset {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/autostream/nginx/cgi/factory-reset.cgi;
        fastcgi_param SCRIPT_NAME /offline/factory-reset;
        fastcgi_pass unix:/run/fcgiwrap.socket;
    }

    location = /offline/update-status {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/autostream/nginx/cgi/update-status.cgi;
        fastcgi_param SCRIPT_NAME /offline/update-status;
        fastcgi_pass unix:/run/fcgiwrap.socket;
    }

    # -------- OwnTone artwork proxy --------
    # Served directly from OwnTone, bypassing the Python web UI entirely.
    # OwnTone runs on localhost only and requires no authentication.
    location /artwork/ {
        proxy_pass http://127.0.0.1:3689;

        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;

        # Do not follow redirects from OwnTone.
        proxy_redirect off;

        # Pass OwnTone responses through as-is, including 404 for missing artwork.
        proxy_intercept_errors off;
    }

    # Suppress successful (2xx) access log entries by default.
    # 99-autostream-access-log.conf (installed in /etc/nginx/conf.d/) defines
    # $autostream_access_log_level: 0 for 2xx, 1 otherwise.
    # autostream_admin set-nginx-access-log verbose|normal switches it live.
    access_log /var/log/nginx/access.log combined if=$autostream_access_log_level;

    # -------- autostream_webui endpoints --------
    location / {
        if ($is_updating) {
            return 302 /offline/updating;
        }

        # Timeouts (also apply to hung/slow backend)
        proxy_connect_timeout 10s;
        proxy_send_timeout 5s;
        proxy_read_timeout 15s;

        # proxy_pass $html_backend$request_uri;
        proxy_pass $html_backend$uri$is_args$args;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
