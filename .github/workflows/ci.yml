name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # -----------------------------------------------------------------------
  # Offline suite — deterministic, unprivileged, no external tools required.
  # Runs on every push/PR.  Environment-dependent tests are skipped here.
  # -----------------------------------------------------------------------
  offline-tests:
    name: Offline test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: test_update_from_030.py extracts the 0.3.0 updater
      # from commit 30ae289 via git show, which a shallow clone lacks.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r tests/requirements-ci.txt

      - name: Run offline test suite
        run: python -m pytest tests/ -q --ignore=tests/playwright --timeout=60

  # -----------------------------------------------------------------------
  # Environment-dependent suite — requires system tools that are absent on
  # Windows and macOS.  Installs: nginx, nodejs, shellcheck, systemd tools.
  # Tests marked node_available, nginx_available, systemd_available,
  # visudo_available, shellcheck_available, and bash_capable now run.
  # -----------------------------------------------------------------------
  env-dependent-tests:
    name: Environment-dependent tests (Linux tools)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: needed by test_update_from_030.py (see offline-tests).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            shellcheck \
            nginx \
            nodejs \
            build-essential \
            systemd

      - name: Install Python dependencies
        run: pip install -r tests/requirements-ci.txt

      - name: Run full test suite (env-dependent tests now active)
        run: python -m pytest tests/ -q --ignore=tests/playwright --timeout=60

  # -----------------------------------------------------------------------
  # WSL-equivalent test suite — same Linux tools as env-dependent-tests but
  # explicitly named to mirror what `scripts/run_wsl_tests.sh` covers locally.
  # Unlocks tests skipped on Windows: Unix sockets, mkfifo, g++, shellcheck,
  # nginx config validation, bash CGI scripts, fcntl-based concurrency.
  # -----------------------------------------------------------------------
  wsl-tests:
    name: WSL / Linux environment tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: needed by test_update_from_030.py (see offline-tests).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            shellcheck \
            nginx \
            nodejs \
            build-essential \
            systemd

      - name: Install Python dependencies
        run: pip install -r tests/requirements-ci.txt

      - name: Run WSL test suite
        run: bash scripts/run_wsl_tests.sh

  # -----------------------------------------------------------------------
  # Playwright browser tests — run against production-rendered HTML served
  # by the stub fixture in tests/playwright/test_ui_flows.py.
  # Set AUTOSTREAM_URL in repository variables to target a real appliance.
  # -----------------------------------------------------------------------
  playwright:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # When AUTOSTREAM_URL is unset, test_ui_flows.py starts a local stub
    # server automatically so browser tests always execute.  Set AUTOSTREAM_URL
    # in repository variables to run the same tests against a real appliance.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r tests/requirements-ci.txt pytest-playwright

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run Playwright tests
        run: python -m pytest tests/playwright/ -q --timeout=60
        env:
          AUTOSTREAM_URL: ${{ vars.AUTOSTREAM_URL }}
