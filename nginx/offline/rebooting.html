<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>autostream</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f5f5f5;
      font-size: 18px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 1.25rem 1.5rem 1.5rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border-radius: 8px;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 0.75rem 0;
    }
    p { margin: 0.35rem 0 0.85rem 0; }
    #status { color: #555; }
  </style>
</head>
<body>
  <div class="container">
    <div style="width:100%;text-align:center;margin-bottom:1rem;">
      <img src="/autostream-badge.png"
           alt="AutoStream"
           style="max-width:100%;height:auto;display:block;margin:0 auto;">
    </div>

    <h1>System is rebooting&hellip;</h1>
    <p id="status">Waiting for the device to restart&hellip;</p>
    <p>If you are not redirected automatically, try
      <a href="/">opening the app</a> again in a moment.</p>
  </div>

  <script>
    // Wait at least 90 s before attempting to return to '/'.
    // The reboot API schedules with a 3 s delay; shutdown + boot takes longer on slower hardware.
    var MIN_WAIT_MS = 90000;
    var startedAt = Date.now();
    var statusEl = document.getElementById('status');

    function setStatus(t) {
      if (statusEl) statusEl.textContent = t;
    }

    function pollRoot() {
      var elapsed = Date.now() - startedAt;
      if (elapsed < MIN_WAIT_MS) {
        var s = Math.ceil((MIN_WAIT_MS - elapsed) / 1000);
        setStatus('Restarting\u2026 returning in ~' + s + 's');
        setTimeout(pollRoot, 700);
        return;
      }
      setStatus('Checking if the app is back\u2026');
      fetch('/', { cache: 'no-store' })
        .then(function(r) {
          // r.redirected is true when nginx intercepted a backend failure and
          // redirected to the offline page — that is NOT a sign the app is back.
          // Only treat the response as "app is up" when it arrived without a redirect.
          if (r && r.ok && !r.redirected) {
            window.location.replace('/');
          } else {
            setTimeout(pollRoot, 1200);
          }
        })
        .catch(function() {
          setTimeout(pollRoot, 1200);
        });
    }

    pollRoot();
  </script>
</body>
</html>
