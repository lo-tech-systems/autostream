<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>autostream</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f5f5f5;
      font-size: 18px;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 1.25rem 1.5rem 1.5rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border-radius: 8px;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 0.75rem 0;
    }

    p {
      margin: 0.35rem 0 0.85rem 0;
    }

    .meta {
      color: #555;
    }

    .progress-shell {
      margin-top: 1.2rem;
      background: #e9ecef;
      border-radius: 999px;
      overflow: hidden;
      height: 18px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #111 0%, #333 100%);
      transition: width 0.3s ease;
    }

    .status-row {
      margin-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .status-label {
      font-weight: 600;
    }

    .status-percent {
      color: #555;
      font-variant-numeric: tabular-nums;
    }

    .status-error .progress-fill {
      background: linear-gradient(90deg, #111 0%, #333 100%);
    }

    .status-success .progress-fill {
      background: linear-gradient(90deg, #111 0%, #333 100%);
    }

    @media (min-width: 600px) {
      body {
        padding: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="page">
    <div style="width:100%;text-align:center;margin-bottom:1rem;">
      <img src="/autostream-badge.png"
           alt="AutoStream"
           style="max-width:100%;height:auto;display:block;margin:0 auto;">
    </div>

    <h1>autostream is currently updating.</h1>
    <p id="message">Checking update status...</p>

    <div class="progress-shell" aria-hidden="true">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <div class="status-row">
      <div class="status-label" id="status-label">Preparing update...</div>
      <div class="status-percent" id="status-percent">0%</div>
    </div>

    <p class="meta" id="last-run">Last update run: unknown</p>
  </div>

  <script>
    var REFRESH_MS = 10000;
    var RESTART_WAIT_MS = 90000;
    var ROOT_POLL_MS = 1500;
    var pageEl = document.getElementById('page');
    var messageEl = document.getElementById('message');
    var fillEl = document.getElementById('progress-fill');
    var statusLabelEl = document.getElementById('status-label');
    var statusPercentEl = document.getElementById('status-percent');
    var lastRunEl = document.getElementById('last-run');
    var successMode = false;
    var successStartedAt = 0;

    function text(el, value) {
      if (el) el.textContent = value;
    }

    function safePercent(value) {
      var n = parseInt(value, 10);
      if (!isFinite(n)) return 0;
      if (n < 0) return 0;
      if (n > 100) return 100;
      return n;
    }

    function render(data) {
      var status = (data && data.status) ? String(data.status) : 'unknown';
      var message = (data && data.message) ? String(data.message) : 'Status temporarily unavailable';
      var percent = safePercent(data && data.percent);
      var lastRun = (data && data.last_run_at) ? String(data.last_run_at) : 'unknown';

      if (successMode) {
        return;
      }

      pageEl.classList.remove('status-error', 'status-success');
      if (status === 'failure' || status === 'error') {
        pageEl.classList.add('status-error');
      } else if (status === 'success') {
        pageEl.classList.add('status-success');
      }

      text(messageEl, message);
      text(statusLabelEl, 'Status: ' + status);
      text(statusPercentEl, percent + '%');
      text(lastRunEl, 'Last update run: ' + lastRun);
      fillEl.style.width = percent + '%';

      if (status === 'success' && percent >= 100) {
        enterSuccessMode(lastRun);
      }
    }

    function pollRoot() {
      text(statusLabelEl, 'Status: waiting for autostream');
      fetch('/', { cache: 'no-store' })
        .then(function(response) {
          if (response && response.ok && !response.redirected) {
            window.location.replace('/');
          } else {
            window.setTimeout(pollRoot, ROOT_POLL_MS);
          }
        })
        .catch(function() {
          window.setTimeout(pollRoot, ROOT_POLL_MS);
        });
    }

    function runRestartCountdown() {
      var elapsed = Date.now() - successStartedAt;
      if (elapsed < RESTART_WAIT_MS) {
        var remainingSeconds = Math.ceil((RESTART_WAIT_MS - elapsed) / 1000);
        text(messageEl, 'autostream appliance is restarting, please wait.');
        text(statusLabelEl, 'Status: restarting');
        text(statusPercentEl, remainingSeconds + 's');
        window.setTimeout(runRestartCountdown, 1000);
        return;
      }

      text(messageEl, 'Checking if autostream is back online...');
      text(statusPercentEl, '100%');
      pollRoot();
    }

    function enterSuccessMode(lastRun) {
      successMode = true;
      successStartedAt = Date.now();
      pageEl.classList.remove('status-error');
      pageEl.classList.add('status-success');
      fillEl.style.width = '100%';
      text(lastRunEl, 'Last update run: ' + lastRun);
      runRestartCountdown();
    }

    function refreshStatus() {
      if (successMode) {
        return;
      }

      fetch('/offline/update-status', { cache: 'no-store' })
        .then(function(response) {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }
          return response.json();
        })
        .then(function(data) {
          render(data);
        })
        .catch(function() {
          render({
            status: 'error',
            message: 'Status temporarily unavailable',
            percent: 0,
            last_run_at: 'unknown'
          });
        })
        .finally(function() {
          if (!successMode) {
            window.setTimeout(refreshStatus, REFRESH_MS);
          }
        });
    }

    refreshStatus();
  </script>
</body>
</html>
