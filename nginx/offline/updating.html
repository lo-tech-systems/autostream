<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>autostream</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f5f5f5;
      font-size: 18px;
      color: #222;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 1.25rem 1.5rem 1.5rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border-radius: 8px;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 0.75rem 0;
    }

    p {
      margin: 0.35rem 0 0.85rem 0;
    }

    .meta {
      color: #555;
    }

    .progress-shell {
      margin-top: 1.2rem;
      background: #e9ecef;
      border-radius: 999px;
      overflow: hidden;
      height: 18px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #111 0%, #333 100%);
      transition: width 0.3s ease;
    }

    @keyframes progress-stripe {
      0%   { background-position: 1rem 0; }
      100% { background-position: 0 0; }
    }

    .progress-fill.is-active {
      background-image:
        linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.12) 25%, transparent 25%,
          transparent 50%, rgba(255, 255, 255, 0.12) 50%,
          rgba(255, 255, 255, 0.12) 75%, transparent 75%, transparent
        ),
        linear-gradient(90deg, #111 0%, #333 100%);
      background-size: 1rem 1rem, auto;
      animation: progress-stripe 0.6s linear infinite;
    }

    .status-row {
      margin-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .status-label {
      font-weight: 600;
    }

    .status-percent {
      color: #555;
      font-variant-numeric: tabular-nums;
    }

    .status-error .progress-fill {
      background: linear-gradient(90deg, #111 0%, #333 100%);
    }

    .status-success .progress-fill {
      background: linear-gradient(90deg, #111 0%, #333 100%);
    }

    .status-stale .status-label {
      color: #888;
    }

    .status-stale .progress-fill {
      background: linear-gradient(90deg, #555 0%, #777 100%);
    }

    .log-tail {
      margin-top: 1rem;
      background: #1a1a1a;
      color: #ccc;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 0.72rem;
      line-height: 1.5;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 9rem;
      overflow-y: auto;
    }

    @media (min-width: 600px) {
      body {
        padding: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="page">
    <div style="width:100%;text-align:center;margin-bottom:1rem;">
      <img src="/autostream-badge.png"
           alt="AutoStream"
           style="max-width:100%;height:auto;display:block;margin:0 auto;">
    </div>

    <h1>autostream is currently updating.</h1>
    <p id="message">Checking update status...</p>

    <div class="progress-shell" aria-hidden="true">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <div class="status-row">
      <div class="status-label" id="status-label">Preparing...</div>
      <div class="status-percent" id="status-percent">0%</div>
    </div>

    <pre class="log-tail" id="log-tail" style="display:none"></pre>

    <p class="meta" id="last-run">Last update run: unknown</p>
  </div>

  <script>
    var REFRESH_MS = 10000;
    var RESTART_WAIT_MS = 90000;
    var ROOT_POLL_MS = 1500;
    var pageEl = document.getElementById('page');
    var messageEl = document.getElementById('message');
    var fillEl = document.getElementById('progress-fill');
    var statusLabelEl = document.getElementById('status-label');
    var statusPercentEl = document.getElementById('status-percent');
    var lastRunEl = document.getElementById('last-run');
    var logTailEl = document.getElementById('log-tail');
    var successMode = false;
    var successStartedAt = 0;
    var lastKnownPercent = 0;
    var consecutiveFailures = 0;
    var lastKnownData = null;
    var OFFLINE_WARN_THRESHOLD     = 18; // ~3 min — escalate offline message
    var OFFLINE_GUIDANCE_THRESHOLD = 60; // ~10 min — offer concrete guidance

    // The status endpoint can report a previous run's status=success/100%
    // before a newly-started update has had a chance to write its own
    // in_progress state (or when this page is opened/reloaded with no
    // update actually running). witnessedActive only becomes true once a
    // poll has actually observed status=in_progress in this page session,
    // and enterSuccessMode is gated on it so a stale/absent success can
    // never be mistaken for this update having finished.
    var witnessedActive = false;
    var noActivityPollCount = 0;
    var NO_ACTIVITY_POLL_LIMIT = 6; // ~1 min at REFRESH_MS

    function text(el, value) {
      if (el) el.textContent = value;
    }

    function safePercent(value) {
      var n = parseInt(value, 10);
      if (!isFinite(n)) return 0;
      if (n < 0) return 0;
      if (n > 100) return 100;
      return n;
    }

    var STATUS_LABELS = {
      'unknown':     'Preparing...',
      'in_progress': 'In progress',
      'success':     'Complete',
      'failure':     'Failed',
      'error':       'Error'
    };

    function friendlyStatus(status) {
      return STATUS_LABELS[status] || status;
    }

    function render(data) {
      var status = (data && data.status) ? String(data.status) : 'unknown';
      var percent = safePercent(data && data.percent);
      var lastRun = (data && data.last_run_at) ? String(data.last_run_at) : 'unknown';
      var isStale = !!(data && data.stale);

      if (status === 'in_progress') {
        witnessedActive = true;
        noActivityPollCount = 0;
      }

      // A success report this page has not itself watched happen (a stale
      // previous run, or the page opened/reloaded with nothing running) must
      // never be treated as this update having completed.
      var waitingForStart = (status === 'success' && !witnessedActive);

      var message;
      var noUpdateRunning = false;
      if (waitingForStart) {
        noActivityPollCount++;
        percent = 0;
        if (noActivityPollCount >= NO_ACTIVITY_POLL_LIMIT) {
          noUpdateRunning = true;
          message = 'No update appears to be running.';
        } else {
          message = 'Waiting for the update to start...';
        }
      } else if (status === 'unknown') {
        message = 'Preparing update...';
      } else if (isStale) {
        var isHung = !!(data && data.hung);
        if (isHung) {
          message = 'The updater is still running but has been unresponsive for 30+ minutes. '
            + 'Power-cycle the device to recover — do not retry until after rebooting.';
        } else {
          message = 'The update is taking longer than expected and may have stalled. '
            + 'Power-cycling the device will trigger automatic recovery, '
            + 'or you can retry from the setup page.';
        }
      } else {
        message = (data && data.message) ? String(data.message) : 'Status temporarily unavailable';
      }

      if (successMode) {
        return;
      }

      pageEl.classList.remove('status-error', 'status-success', 'status-stale');
      if (waitingForStart) {
        // Neither success nor error/stale — deliberately unstyled/neutral.
      } else if (isStale) {
        pageEl.classList.add('status-stale');
      } else if (status === 'failure' || status === 'error') {
        pageEl.classList.add('status-error');
      } else if (status === 'success') {
        pageEl.classList.add('status-success');
      }

      if (status === 'in_progress' && !isStale) {
        fillEl.classList.add('is-active');
      } else {
        fillEl.classList.remove('is-active');
      }

      var logTail = (data && data.log_tail) ? String(data.log_tail) : '';
      if (logTail && logTailEl) {
        logTailEl.style.display = '';
        logTailEl.textContent = logTail;
        logTailEl.scrollTop = logTailEl.scrollHeight;
      } else if (logTailEl) {
        logTailEl.style.display = 'none';
        logTailEl.textContent = '';
      }

      if (noUpdateRunning) {
        messageEl.textContent = '';
        messageEl.appendChild(document.createTextNode(message + ' '));
        var link = document.createElement('a');
        link.href = '/';
        link.textContent = 'Return to autostream';
        messageEl.appendChild(link);
      } else {
        text(messageEl, message);
      }
      text(statusLabelEl, waitingForStart
        ? (noUpdateRunning ? 'Not running' : 'Waiting...')
        : (isStale ? 'Possibly stalled' : friendlyStatus(status)));
      text(statusPercentEl, percent + '%');
      text(lastRunEl, 'Last update run: ' + lastRun);
      fillEl.style.width = percent + '%';

      if (status === 'success' && percent >= 100 && witnessedActive) {
        enterSuccessMode(lastRun);
      }
    }

    function pollRoot() {
      text(statusLabelEl, 'Waiting for autostream...');
      fetch('/', { cache: 'no-store' })
        .then(function(response) {
          if (response && response.ok && !response.redirected) {
            window.location.replace('/');
          } else {
            window.setTimeout(pollRoot, ROOT_POLL_MS);
          }
        })
        .catch(function() {
          window.setTimeout(pollRoot, ROOT_POLL_MS);
        });
    }

    function runRestartCountdown() {
      var elapsed = Date.now() - successStartedAt;
      if (elapsed < RESTART_WAIT_MS) {
        var remainingSeconds = Math.ceil((RESTART_WAIT_MS - elapsed) / 1000);
        text(messageEl, 'autostream appliance is restarting, please wait.');
        text(statusLabelEl, 'Restarting...');
        text(statusPercentEl, remainingSeconds + 's');
        window.setTimeout(runRestartCountdown, 1000);
        return;
      }

      text(messageEl, 'Checking if autostream is back online...');
      text(statusPercentEl, '100%');
      pollRoot();
    }

    function enterSuccessMode(lastRun) {
      successMode = true;
      successStartedAt = Date.now();
      pageEl.classList.remove('status-error');
      pageEl.classList.add('status-success');
      fillEl.style.width = '100%';
      text(lastRunEl, 'Last update run: ' + lastRun);
      runRestartCountdown();
    }

    function refreshStatus() {
      if (successMode) {
        return;
      }

      fetch('/offline/update-status', { cache: 'no-store' })
        .then(function(response) {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }
          return response.json();
        })
        .then(function(data) {
          consecutiveFailures = 0;
          lastKnownData = data;
          lastKnownPercent = safePercent(data && data.percent);
          render(data);
        })
        .catch(function() {
          consecutiveFailures++;
          var offlineMsg;
          if (consecutiveFailures >= OFFLINE_GUIDANCE_THRESHOLD) {
            offlineMsg = 'The device has been unreachable for over 10 minutes. '
              + 'Check that it is powered on and connected to the network. '
              + 'If the problem persists, try power-cycling the device.';
          } else if (consecutiveFailures >= OFFLINE_WARN_THRESHOLD) {
            offlineMsg = 'Device has been unreachable for several minutes — '
              + 'it may still be recovering or retrying the update.';
          } else {
            offlineMsg = 'Waiting for device to come back...';
          }
          // Merge onto last known payload so last_run_at and log_tail stay visible.
          // Force stale:false so the offline message is not overridden by stale guidance.
          render(Object.assign({}, lastKnownData || {}, {
            status: 'in_progress',
            stale: false,
            message: offlineMsg,
            percent: lastKnownPercent
          }));
        })
        .finally(function() {
          if (!successMode) {
            window.setTimeout(refreshStatus, REFRESH_MS);
          }
        });
    }

    refreshStatus();
  </script>
</body>
</html>
